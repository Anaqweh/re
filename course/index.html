  <style>
    :root{--blue:#0866c6;--dark:#103b70;--pale:#f3f8ff;--line:#dcecff;--muted:#62788f}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:#19314b;font-family:Arial,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:34px auto}.back{display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-weight:bold;text-decoration:none;font-size:13px;margin:0 0 15px}.card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 50px #07539814}.cover{width:100%;height:330px;display:block;object-fit:cover;background:#0b4d90}.content{padding:30px 36px 36px}.tag{display:inline-block;color:var(--blue);background:#eaf4ff;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:bold}.intro h1{font-size:30px;color:var(--dark);line-height:1.55;margin:15px 0 8px}.intro p{line-height:2;color:var(--muted);font-size:15px;margin:0}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:21px 0}.meta span{padding:8px 10px;border:1px solid #e0edf9;border-radius:10px;background:#f8fbff;font-size:12px;color:#4d6d8a}.journey{border-top:1px solid #e6f0fa;padding-top:20px}.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:0 0 23px}.step{border:1px solid #dceafb;background:#fff;color:#6b8195;border-radius:10px;padding:10px 8px;font-size:11px;font-weight:bold;cursor:pointer;text-align:center}.step.active{background:var(--blue);border-color:var(--blue);color:#fff}.step.done{color:var(--blue);border-color:#abd7ff}.panel{display:none;animation:rise .2s ease}.panel.active{display:block}.panel h2{color:var(--dark);font-size:22px;margin:0 0 12px}.panel-lead{font-size:14px;line-height:2;color:var(--muted);margin:0 0 18px}.rich p{margin:0 0 11px;line-height:2;color:#46627c;font-size:14px}.rich strong,.axis-group strong,.outcome strong{color:#0d477e;font-weight:800}.rich-heading{margin:17px 0 7px;color:#0b5cac;font-size:17px}.axis-group{margin:10px 0;background:#f7fbff;border:1px solid #dceafb;border-radius:14px;overflow:hidden}.axis-group summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;color:#0d477e;font-size:14px;font-weight:800}.axis-group summary::-webkit-details-marker{display:none}.axis-number{font-style:normal;color:#fff;background:var(--blue);width:25px;height:25px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;flex:0 0 auto}.axis-arrow{margin-right:auto;color:var(--blue);font-size:16px;transition:.2s}.axis-group[open] .axis-arrow{transform:rotate(180deg)}.axis-list{margin:0;padding:0 45px 17px 18px;color:#46627c;line-height:2;font-size:13px}.axis-list li{margin:5px 0}.axis-empty{margin:0;padding:0 50px 17px;color:#60788f;font-size:13px}.price-box{border:1px solid #d9eafb;background:#f7fbff;border-radius:18px;padding:22px}.price-top{display:flex;align-items:center;gap:12px;color:var(--dark);font-size:16px;font-weight:800}.price-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#eaf4ff;font-size:21px}.price-amount{font-size:30px;color:var(--blue);font-weight:800;margin:20px 0 7px}.price-note{color:#5c748c;font-size:13px;line-height:2;margin:0}.outcome{padding:14px 15px;margin:9px 0;border-right:4px solid #18a878;background:#f4fcf8;border-radius:10px;color:#42657d;line-height:1.9;font-size:14px}.register-box{padding:24px;border-radius:18px;background:linear-gradient(135deg,#063f86,#0866c6);color:#fff}.register-box h2{color:#fff;margin:0 0 8px}.register-box p{color:#e7f3ff;line-height:2;margin:0 0 18px;font-size:14px}.button{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#0866c6;text-decoration:none;padding:13px 19px;border-radius:10px;font-weight:bold;font-size:14px}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:25px}.next,.previous{border:0;border-radius:10px;padding:11px 16px;font-family:inherit;font-weight:bold;cursor:pointer}.next{background:var(--blue);color:#fff}.previous{background:#eef6ff;color:var(--blue)}.previous[hidden],.next[hidden]{display:none}@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}@media(max-width:600px){.wrap{width:calc(100% - 20px);margin:18px auto}.card{border-radius:18px}.cover{height:210px}.content{padding:22px 17px 24px}.intro h1{font-size:24px}.intro p,.panel-lead{font-size:13px}.steps{grid-template-columns:1fr 1fr}.step{font-size:10px;padding:9px 5px}.panel h2{font-size:19px}.outcome,.rich p{font-size:13px}.axis-group summary{font-size:13px}.controls{position:sticky;bottom:8px;background:#ffffffed;padding:10px 0 0}.next,.previous{flex:1}}
