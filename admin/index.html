<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة INEXC</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#f3f8ff}</style></head><body>
<iframe id="adminFrame" title="لوحة إدارة INEXC" src="/admin-portal.html"></iframe>
<script>
const frame=document.getElementById('adminFrame');
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(d.getElementById('emailsFile'))return;const extra=d.getElementById('extraEmails');if(!extra)return;const label=d.createElement('label');label.textContent='تحميل ملف عناوين البريد';const input=d.createElement('input');input.id='emailsFile';input.type='file';input.accept='.csv,.txt,text/csv,text/plain';const note=d.createElement('div');note.className='note';note.textContent='ارفع ملف CSV أو TXT؛ سيتم استخراج عناوين البريد الصحيحة فقط وحذف المكرر.';extra.insertAdjacentElement('afterend',label);label.insertAdjacentElement('afterend',input);input.insertAdjacentElement('afterend',note);input.addEventListener('change',async()=>{const file=input.files[0];if(!file)return;const raw=await file.text();const emails=[...new Set((raw.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}/gi)||[]).map(x=>x.toLowerCase()))];const result=d.getElementById('messageResult');if(!emails.length){result.textContent='لم نجد عناوين بريد صالحة في الملف.';return}extra.value=[extra.value.trim(),...emails].filter(Boolean).join('\\n');result.style.color='#168865';result.textContent='تمت إضافة '+emails.length+' عنوان بريد من الملف.'})}catch(e){}});
</script></body></html>
