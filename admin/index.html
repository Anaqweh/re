<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة INEXC</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#f3f8ff}</style></head><body>
<iframe id="adminFrame" title="لوحة إدارة INEXC" src="/admin-portal.html"></iframe>
<script>
const frame=document.getElementById('adminFrame');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow;if(d.getElementById('courseImage'))return;const $=s=>d.querySelector(s),api=w.INEXC_REGISTRATION_ENDPOINT,token=w.sessionStorage.getItem('inexc_do_admin')||'';
const call=async(path,opt={})=>{let headers={Authorization:'Bearer '+token,...(opt.headers||{})};if(!(opt.body instanceof FormData))headers['Content-Type']='application/json';let r=await fetch(api+path,{...opt,headers});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'تعذر إتمام العملية.');return j};
const form=$('#courseForm'),bank=$('#bankIban');bank.insertAdjacentHTML('afterend','<label>صورة الدورة للموقع والمشاركة</label><input id="courseImage" type="file" accept="image/png,image/jpeg,image/webp"><div class="note">تظهر في رابط واتساب ووسائل التواصل. إن لم تُرفع صورة، يظهر شعار INEXC الكحلي.</div><label>نموذج الشهادة للعرض</label><input id="certificateSample" type="file" accept="image/png,image/jpeg,image/webp,application/pdf,.docx"><div id="shareBox" class="note">احفظ الدورة أولًا ليظهر رابط المشاركة.</div>');
const emailBox=$('#extraEmails');emailBox.insertAdjacentHTML('afterend','<label>تحميل ملف عناوين البريد</label><input id="emailsFile" type="file" accept=".csv,.txt,text/csv,text/plain"><label>مرفق للرسالة</label><input id="messageAttachment" type="file"><div id="attachmentInfo" class="note">ملفات PDF وOffice والصور وغيرها مسموحة حتى 10MB، باستثناء الملفات التنفيذية.</div>');
let attachmentPath='';$('#emailsFile').onchange=async()=>{let f=$('#emailsFile').files[0];if(!f)return;let raw=await f.text(),emails=[...new Set((raw.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}/gi)||[]).map(x=>x.toLowerCase()))];if(!emails.length)return $('#messageResult').textContent='لم نجد عناوين بريد صالحة في الملف.';emailBox.value=[emailBox.value.trim(),...emails].filter(Boolean).join('\\n');$('#messageResult').style.color='#168865';$('#messageResult').textContent='تمت إضافة '+emails.length+' عنوان بريد من الملف.'};
$('#messageAttachment').onchange=async()=>{let f=$('#messageAttachment').files[0];if(!f)return;if(f.size>10*1024*1024)return $('#attachmentInfo').textContent='حجم المرفق يتجاوز 10MB.';let fd=new FormData();fd.append('file',f);try{let r=await call('/admin/message-attachments',{method:'POST',body:fd});attachmentPath=r.attachmentPath;$('#attachmentInfo').textContent='تم تجهيز المرفق: '+r.fileName}catch(e){$('#attachmentInfo').textContent=e.message}};
form.onsubmit=async e=>{e.preventDefault();let id=$('#courseId').value,dta={name:$('#courseName').value,description:$('#courseDescription').value,category:$('#courseCategory').value,price:$('#coursePrice').value,date:$('#courseDate').value,location:$('#courseLocation').value,certificate:{mode:$('#certificateMode').value,name:$('#certificateName').value,price:$('#certificatePrice').value},payments:[$('#payLink').checked?'link':'',$('#payBank').checked?'bank':''].filter(Boolean),paymentLink:$('#paymentLink').value,bank:{name:$('#bankName').value,account:$('#bankAccount').value,iban:$('#bankIban').value},active:$('#courseActive').checked};try{let course=await call('/admin/courses'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(dta)});for(const [input,route] of [['courseImage','image'],['certificateSample','certificate-sample']]){let file=$('#'+input).files[0];if(file){let fd=new FormData();fd.append('file',file);await call('/admin/courses/'+course.id+'/'+route,{method:'POST',body:fd})}}$('#courseId').value=course.id;$('#shareBox').innerHTML='رابط المشاركة الجاهز:<br><a target="_blank" href="'+course.shareUrl+'" style="direction:ltr">'+course.shareUrl+'</a>';$('#courseError').style.color='#168865';$('#courseError').textContent='تم حفظ الدورة ورفع الملفات بنجاح.';w.loadCourses()}catch(x){$('#courseError').style.color='#b02b3a';$('#courseError').textContent=x.message}};
$('#send').onclick=async()=>{let audience=$('#audience').value,subject=$('#subject').value.trim(),message=$('#message').value.trim(),extra=emailBox.value;if(!subject||!message)return $('#messageResult').textContent='اكتب عنوان الرسالة ونصها.';if(audience==='custom'&&!extra.trim())return $('#messageResult').textContent='أضف بريدًا إلكترونيًا واحدًا على الأقل.';if(audience==='course'&&!$('#messageCourse').value)return $('#messageResult').textContent='اختر دورة أولًا.';let b=$('#send');b.disabled=true;b.textContent='جارٍ الإرسال...';try{let r=await call('/admin/messages',{method:'POST',body:JSON.stringify({audience,ids:[],courseId:$('#messageCourse').value,extraEmails:extra,attachmentPath,subject,message})});$('#messageResult').style.color='#168865';$('#messageResult').textContent='تم إرسال '+r.sent+' رسالة. ستظهر النتائج في تبويب تقارير الإرسال.';$('#subject').value=$('#message').value=emailBox.value='';attachmentPath='';$('#messageAttachment').value=''}catch(x){$('#messageResult').style.color='#b02b3a';$('#messageResult').textContent=x.message}finally{b.disabled=false;b.textContent='إرسال الرسالة'}};
const tabs=$('.tabs'),wrap=$('.wrap');tabs.insertAdjacentHTML('beforeend','<button class="light" data-view="campaigns">تقارير الإرسال</button>');wrap.insertAdjacentHTML('beforeend','<section id="campaigns" class="view"><div class="panel" style="padding:18px"><div class="tools"><h2 style="flex:1;margin:0;color:#103b70;font-size:18px">تقارير الرسائل</h2><button id="reloadCampaigns" class="light">تحديث</button></div><div id="campaignTable" class="table">اضغط تحديث لعرض النتائج.</div></div></section>');
async function campaigns(){try{let rows=await call('/admin/campaigns');$('#campaignTable').innerHTML='<table><thead><tr><th>العنوان</th><th>التاريخ</th><th>الإجمالي</th><th>وصل</th><th>فُتح</th><th>نُقر</th><th>فشل</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.subject)+'</td><td>'+new Date(x.created_at).toLocaleString('ar-AE')+'</td><td>'+x.total+'</td><td>'+x.delivered+'</td><td>'+x.opened+'</td><td>'+x.clicked+'</td><td>'+x.failed+'</td></tr>').join('')+'</tbody></table>'}catch(e){$('#campaignTable').textContent=e.message}}$('#reloadCampaigns').onclick=campaigns;
}catch(e){}});
</script><script>
/* إضافة محاور الدورة والاستيراد من ملف إلى لوحة الإدارة الحالية. */
frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow,$=s=>d.querySelector(s),api=w.INEXC_REGISTRATION_ENDPOINT,token=w.sessionStorage.getItem('inexc_do_admin')||'';if(!token||d.getElementById('courseAxes'))return;const call=async(path,opt={})=>{let headers={Authorization:'Bearer '+token,...(opt.headers||{})};if(!(opt.body instanceof FormData))headers['Content-Type']='application/json';let r=await fetch(api+path,{...opt,headers}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'تعذر إتمام العملية.');return j};const description=$('#courseDescription');description.insertAdjacentHTML('afterend','<label>محاور الدورة</label><textarea id="courseAxes" placeholder="اكتب كل محور في سطر مستقل"></textarea><label>استيراد محتوى الدورة من ملف</label><input id="courseImport" type="file" accept=".docx,.txt,.md,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"><div id="courseImportInfo" class="note">ارفع Word (DOCX) أو TXT. استخدم العناوين: اسم الدورة، الوصف، محاور الدورة.</div>');const axes=$('#courseAxes'),importFile=$('#courseImport'),importInfo=$('#courseImportInfo');importFile.onchange=async()=>{let file=importFile.files[0];if(!file)return;let fd=new FormData();fd.append('file',file);importInfo.textContent='جارٍ قراءة الملف...';try{let data=await call('/admin/course-import',{method:'POST',body:fd});if(data.name)$('#courseName').value=data.name;if(data.description)description.value=data.description;axes.value=(data.axes||[]).join('\n');importInfo.style.color='#168865';importInfo.textContent='تمت تعبئة البيانات من الملف. راجعها ثم اضغط حفظ الدورة.'}catch(error){importInfo.style.color='#b02b3a';importInfo.textContent=error.message}};const form=$('#courseForm');form.onsubmit=async event=>{event.preventDefault();let id=$('#courseId').value,data={name:$('#courseName').value,description:description.value,axes:axes.value,category:$('#courseCategory').value,price:$('#coursePrice').value,date:$('#courseDate').value,location:$('#courseLocation').value,certificate:{mode:$('#certificateMode').value,name:$('#certificateName').value,price:$('#certificatePrice').value},payments:[$('#payLink').checked?'link':'',$('#payBank').checked?'bank':''].filter(Boolean),paymentLink:$('#paymentLink').value,bank:{name:$('#bankName').value,account:$('#bankAccount').value,iban:$('#bankIban').value},active:$('#courseActive').checked};try{let course=await call('/admin/courses'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(data)});for(const [input,route] of [['courseImage','image'],['certificateSample','certificate-sample']]){let file=$('#'+input).files[0];if(file){let fd=new FormData();fd.append('file',file);await call('/admin/courses/'+course.id+'/'+route,{method:'POST',body:fd})}}$('#courseId').value=course.id;$('#shareBox').innerHTML='رابط المشاركة الجاهز:<br><a target="_blank" href="'+course.shareUrl+'" style="direction:ltr">'+course.shareUrl+'</a>';$('#courseError').style.color='#168865';$('#courseError').textContent='تم حفظ الدورة ومحاورها بنجاح.';w.loadCourses()}catch(error){$('#courseError').style.color='#b02b3a';$('#courseError').textContent=error.message}};d.getElementById('courseList').addEventListener('click',event=>{let button=event.target.closest('button[onclick^="edit"]');if(!button)return;let id=(button.getAttribute('onclick').match(/'([^']+)'/)||[])[1];if(!id)return;setTimeout(async()=>{try{let courses=await call('/admin/courses');let course=courses.find(item=>item.id===id);if(course)axes.value=(course.axes||[]).join('\n')}catch(_error){}},0)});d.getElementById('newCourse').addEventListener('click',()=>{axes.value='';importFile.value='';importInfo.style.color='';importInfo.textContent='ارفع Word (DOCX) أو TXT. استخدم العناوين: اسم الدورة، الوصف، محاور الدورة.'});}catch(_error){}});
</script></body></html>
