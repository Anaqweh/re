<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تصاميم صفحات الهبوط | INEXC Training</title><link rel="icon" href="./assets/inexc-logo-sm.png"><style>@font-face{font-family:IBM;src:url('./assets/fonts/ibm-plex-arabic/Regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:IBM;src:url('./assets/fonts/ibm-plex-arabic/SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}*{box-sizing:border-box}body{margin:0;font:15px/1.6 IBM,Tahoma,Arial;background:#edf2f8;color:#303741;height:100dvh;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 24px;background:#fff;border-bottom:1px solid #dce5ef}strong{font-size:18px;font-weight:600;color:#0868e8}small{display:block;color:#6c7787;font-size:12px}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label{display:flex;align-items:center;gap:8px;font-size:13px}select,a{font:inherit;min-height:42px;border:1px solid #d8e3ef;border-radius:8px;background:#fff;padding:8px 12px;color:#344050}a{text-decoration:none;color:#0868e8;display:flex;align-items:center}select:focus-visible,a:focus-visible{outline:3px solid #84b6fc;outline-offset:3px}main{min-height:0;padding:18px;display:flex;justify-content:center}iframe{width:100%;height:100%;border:1px solid #d3e0ee;border-radius:12px;background:#fff}.mobile{max-width:390px}@media(max-width:700px){header{padding:12px 16px;display:block}header>div{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}small{font-size:11px}nav{gap:8px}label{flex:1;min-width:110px}select{width:100%;font-size:14px}nav a{font-size:12px}main{padding:8px}strong{font-size:16px}.device{display:none}}@media(max-width:380px){header>div{display:block}small{margin-top:4px}}</style></head><body><header><div><strong>تصاميم صفحات الهبوط</strong><small>معاينة تفاعلية · النماذج لا ترسل بيانات</small></div><nav aria-label="خيارات المعاينة"><label>التصميم<select id="design"><option value="blueprint">أثر · برنامج تدريبي</option><option value="spotlight">لقاء · ورشة وفعالية</option><option value="editorial">مدار · المؤسسات</option><option value="folio">معرفة · دليل عملي</option></select></label><label>اللغة<select id="language"><option value="ar">العربية</option><option value="en">English</option></select></label><label class="device">العرض<select id="device"><option value="desktop">كمبيوتر</option><option value="mobile">هاتف</option></select></label><a href="/admin#landing-pages">التخصيص في الإدارة ↗</a></nav></header><main><iframe title="معاينة تصميم صفحة الهبوط" sandbox="allow-scripts"></iframe></main><script type="module">import{landingPreset}from'./inexc-api/landing-presets.js?v=20261015-landing1';import{renderLanding}from'./inexc-api/landing-render.js?v=20261015-landing1';const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);if(['blueprint','spotlight','editorial','folio'].includes(params.get('design')))$('#design').value=params.get('design');if(params.get('lang')==='en')$('#language').value='en';function render(){$('iframe').srcdoc=renderLanding(landingPreset($('#design').value,$('#language').value),{preview:true});history.replaceState(null,'','?'+new URLSearchParams({design:$('#design').value,lang:$('#language').value}));}$('#design').onchange=render;$('#language').onchange=render;$('#device').onchange=()=>{$('iframe').classList.toggle('mobile',$('#device').value==='mobile')};render();</script></body></html>
