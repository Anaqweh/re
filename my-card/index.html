<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقتي التدريبية | INEXC</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--b:#0866c6;--d:#103b70;--p:#f2f8ff;--l:#dcecff;--m:#60788f}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Alexandria,Arial;color:#183553}.wrap{width:min(780px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--l);padding:19px 0}.top a{color:var(--d);font-weight:800;text-decoration:none}.intro{text-align:center;padding:48px 0 23px}.intro h1{font-size:28px;color:var(--d);margin:0 0 9px}.intro p{font-size:12px;color:var(--m);line-height:1.9}.lookup,.card,.history{background:#fff;border:1px solid var(--l);border-radius:19px;padding:22px;box-shadow:0 12px 34px #1662a212}.lookup label{font-size:11px;font-weight:700;color:var(--d)}.lookup input{width:100%;border:1px solid #d4e5f7;border-radius:10px;padding:13px;margin:6px 0 14px;font:12px Alexandria}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:var(--b);color:#fff;font:700 12px Alexandria;cursor:pointer}.error{font-size:11px;color:#b02b3a;min-height:18px;margin-top:10px}.result{display:none}.digital{background:linear-gradient(135deg,#063d78,#0873d7);border-radius:18px;padding:25px;color:white;position:relative;overflow:hidden}.digital:after{content:'';position:absolute;width:220px;height:220px;border:36px solid #fff2;border-radius:50%;left:-110px;bottom:-150px}.digital small{opacity:.8;font-size:10px}.digital h2{font-size:23px;margin:12px 0}.code{font-family:monospace;font-size:18px;letter-spacing:1px;direction:ltr;text-align:right}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.stat{background:#f6fbff;border:1px solid var(--l);border-radius:12px;padding:13px}.stat span{display:block;font-size:10px;color:var(--m)}.stat b{display:block;color:var(--d);margin-top:6px;font-size:15px}.history{margin:16px 0 45px}.history h3{margin:0 0 10px;color:var(--d);font-size:15px}.entry{padding:12px 0;border-top:1px solid #edf4fb;font-size:11px}.entry b{display:block;color:var(--d);margin-bottom:4px}.entry span{color:var(--m)}@media(max-width:500px){.stats{grid-template-columns:1fr}.intro{padding-top:34px}}</style></head><body><header class="top"><div class="wrap"><a href="/cards/">بطاقات INEXC التدريبية</a></div></header><main class="wrap"><section class="intro"><h1>بطاقتي التدريبية</h1><p>أدخل رقم بطاقتك والبريد المرتبط بها لعرض الرصيد والحجوزات.</p></section><section class="lookup" id="lookup"><label>رقم البطاقة<input id="code" placeholder="INX-…"></label><label>البريد الإلكتروني<input id="email" type="email" placeholder="name@example.com"></label><button class="btn" id="show">عرض بطاقتي</button><div class="error" id="error"></div></section><section class="result" id="result"><div class="card"><div class="digital"><small>INEXC LEARNING PASS</small><h2 id="plan"></h2><small>رقم البطاقة</small><div class="code" id="cardNumber"></div><p id="holder" style="font-size:12px;margin:17px 0 0"></p></div><button class="btn" id="downloadCard" style="margin-top:14px">تحميل البطاقة الرقمية</button><div class="stats"><div class="stat"><span>الرصيد التدريبي المتبقي</span><b id="credits"></b></div><div class="stat"><span>صالحة حتى</span><b id="expires"></b></div><div class="stat"><span>خصم رسوم الشهادات</span><b id="discount"></b></div><div class="stat"><span>الحجز المبكر</span><b id="early"></b></div></div></div><div class="history"><h3>سجل استخدام البطاقة</h3><div id="history"></div></div></section></main><script src="../inexc-registration-config.js"></script><script>const API=window.INEXC_REGISTRATION_ENDPOINT,$=x=>document.getElementById(x);function date(v){return new Intl.DateTimeFormat('ar-AE',{year:'numeric',month:'long',day:'numeric'}).format(new Date(v))}async function load(){const code=$('code').value.trim(),email=$('email').value.trim();$('error').textContent='';try{const r=await fetch(API+'/memberships/card?code='+encodeURIComponent(code)+'&email='+encodeURIComponent(email)),d=await r.json();if(!r.ok)throw Error(d.error||'تعذر عرض البطاقة.');$('lookup').style.display='none';$('result').style.display='block';$('plan').textContent=d.plan.name;$('cardNumber').textContent=d.cardNumber;$('holder').textContent=d.holderName;$('credits').textContent=d.unitsRemaining+' من '+d.unitsTotal;$('expires').textContent=date(d.expiresAt);$('discount').textContent=d.plan.certificateDiscount?d.plan.certificateDiscount+'%':'غير متاح';$('early').textContent=d.plan.earlyAccessHours?'قبل العامة بـ'+d.plan.earlyAccessHours+' ساعة':'غير متاح';$('history').innerHTML=d.redemptions.length?d.redemptions.map(x=>'<div class="entry"><b>'+x.courseName+'</b><span>استخدم '+x.unitsUsed+' من الرصيد · '+date(x.createdAt)+'</span></div>').join(''):'<p style="font-size:11px;color:#60788f">لم تستخدم البطاقة في أي حجز بعد.</p>'}catch(e){$('error').textContent=e.message}}$('show').onclick=load;$('downloadCard').onclick=()=>{const plan=$('plan').textContent,code=$('cardNumber').textContent,name=$('holder').textContent,until=$('expires').textContent;const svg='<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#0866c6" rx="42"/><circle cx="1040" cy="570" r="220" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="50"/><text x="90" y="120" fill="white" font-size="34" font-family="Arial" font-weight="bold">INEXC TRAINING</text><text x="90" y="240" fill="white" font-size="58" font-family="Arial" font-weight="bold">'+plan.replace(/[&<>]/g,'')+'</text><text x="90" y="335" fill="#dcecff" font-size="30" font-family="Arial">'+name.replace(/[&<>]/g,'')+'</text><text x="90" y="480" fill="white" font-size="42" font-family="monospace">'+code.replace(/[&<>]/g,'')+'</text><text x="90" y="590" fill="#dcecff" font-size="28" font-family="Arial">صالحة حتى: '+until.replace(/[&<>]/g,'')+'</text></svg>';const a=document.createElement('a');a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);a.download='INEXC-card-'+code+'.svg';a.click();};</script></body></html>
